<style>
.products {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  margin-bottom: 40px;
}

.card {
  background: #fff;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 4px 10px #ddd;
  text-align: center;
}

.card img {
  max-width: 100%;
  height: 180px;
  object-fit: contain;
}
</style>


<div id="face-wash-section"></div>
<div id="moisturizers-section"></div>
<div id="sunscreen-section"></div>

<script>
const sections = [
  {
    category: "face-wash",
    title: "Face Wash Products",
    container: "face-wash-section"
  },
  {
    category: "moisturizers",
    title: "Moisturizers Products",
    container: "moisturizers-section"
  },
  {
    category: "sunscreen",
    title: "Sunscreen Products",
    container: "sunscreen-section"
  }
];

sections.forEach(section => {
  fetch(`backend-products.php?category=${section.category}`)
    .then(res => res.json())
    .then(result => {
      const products = result.data.productsByCategory;
      const box = document.getElementById(section.container);

      box.innerHTML = `
        <h2>${section.title}</h2>
        <div class="products">
          ${products.map(product => `
            <div class="card">
              <img src="${product.primaryImage}" width="200">
              <h3>${product.name}</h3>
              <p>₹${product.price}</p>
              <a href="${product.link}">View Product</a>
            </div>
          `).join("")}
        </div>
      `;
    })
    .catch(error => console.log(error));
});
</script>
